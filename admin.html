<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Contact Submissions</title>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, query, orderBy, updateDoc, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCn8iimVdTVVZ5AO_OCmGlTliupzJJ4qbI",
            authDomain: "suryatanaya2026.firebaseapp.com",
            projectId: "suryatanaya2026",
            storageBucket: "suryatanaya2026.firebasestorage.app",
            messagingSenderId: "548219372581",
            appId: "1:548219372581:web:175fc351feb0cc6c412bcc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.firestoreDB = db;
        window.firestoreCollection = collection;
        window.firestoreGetDocs = getDocs;
        window.firestoreQuery = query;
        window.firestoreOrderBy = orderBy;
        window.firestoreUpdateDoc = updateDoc;
        window.firestoreDoc = doc;
        window.firestoreDeleteDoc = deleteDoc;

        console.log('✅ Firebase Admin initialized');
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #2d3748;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, #0066cc, #004c99);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-left: 4px solid #0066cc;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #718096;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #0066cc;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #0066cc;
            color: white;
        }

        .btn-primary:hover {
            background: #004c99;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .filter-select {
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .search-box {
            padding: 10px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            flex: 1;
            min-width: 250px;
        }

        .submissions-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .submission-card {
            border-bottom: 1px solid #e2e8f0;
            padding: 20px;
            transition: background 0.2s;
        }

        .submission-card:hover {
            background: #f7fafc;
        }

        .submission-card:last-child {
            border-bottom: none;
        }

        .submission-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .submission-info {
            flex: 1;
        }

        .submission-name {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .submission-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            color: #718096;
            font-size: 14px;
        }

        .submission-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-new {
            background: #fed7d7;
            color: #c53030;
        }

        .badge-read {
            background: #bee3f8;
            color: #2c5282;
        }

        .badge-replied {
            background: #c6f6d5;
            color: #22543d;
        }

        .submission-subject {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #0066cc;
        }

        .submission-message {
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .submission-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 6px 12px;
            border: 1px solid #e2e8f0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #f7fafc;
            border-color: #cbd5e0;
        }

        .action-btn.delete {
            color: #e53e3e;
            border-color: #feb2b2;
        }

        .action-btn.delete:hover {
            background: #fff5f5;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #a0aec0;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #0066cc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .submission-header {
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="container">
            <h1>📊 Contact Submissions Dashboard</h1>
            <p>Manage and respond to contact form submissions</p>
        </div>
    </header>

    <div class="container">
        <!-- Statistics -->
        <div class="stats">
            <div class="stat-card">
                <h3>Total Submissions</h3>
                <div class="number" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>New</h3>
                <div class="number" id="newCount" style="color: #e53e3e;">0</div>
            </div>
            <div class="stat-card">
                <h3>Read</h3>
                <div class="number" id="readCount" style="color: #3182ce;">0</div>
            </div>
            <div class="stat-card">
                <h3>Replied</h3>
                <div class="number" id="repliedCount" style="color: #38a169;">0</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="btn-primary" onclick="loadSubmissions()">🔄 Refresh</button>
            <select class="filter-select" id="statusFilter" onchange="filterSubmissions()">
                <option value="all">All Status</option>
                <option value="new">New</option>
                <option value="read">Read</option>
                <option value="replied">Replied</option>
            </select>
            <input type="text" class="search-box" id="searchBox" placeholder="Search by name, email, or subject..."
                oninput="filterSubmissions()">
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">
            <div class="spinner"></div>
            <p>Loading submissions...</p>
        </div>

        <!-- Submissions List -->
        <div id="submissionsContainer" class="submissions-container" style="display: none;">
            <!-- Submissions will be loaded here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4">
                </path>
            </svg>
            <h3>No submissions found</h3>
            <p>Contact form submissions will appear here</p>
        </div>
    </div>

    <!-- View Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Submission Details</div>
            <div id="modalBody"></div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getFirestore, collection, getDocs, query, orderBy, updateDoc, doc, deleteDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        let allSubmissions = [];
        const db = window.firestoreDB;

        // Load submissions from Firestore
        window.loadSubmissions = async function () {
            const loadingState = document.getElementById('loadingState');
            const submissionsContainer = document.getElementById('submissionsContainer');
            const emptyState = document.getElementById('emptyState');

            loadingState.style.display = 'block';
            submissionsContainer.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                const q = query(
                    collection(db, 'contact_submissions'),
                    orderBy('submittedAt', 'desc')
                );

                const querySnapshot = await getDocs(q);
                allSubmissions = [];

                querySnapshot.forEach((doc) => {
                    allSubmissions.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });

                console.log(`✅ Loaded ${allSubmissions.length} submissions`);

                updateStats();
                displaySubmissions(allSubmissions);

                loadingState.style.display = 'none';

                if (allSubmissions.length > 0) {
                    submissionsContainer.style.display = 'block';
                } else {
                    emptyState.style.display = 'block';
                }

            } catch (error) {
                console.error('❌ Error loading submissions:', error);
                loadingState.innerHTML = `<p style="color: #e53e3e;">Error loading submissions: ${error.message}</p>`;
            }
        };

        // Update statistics
        function updateStats() {
            const total = allSubmissions.length;
            const newCount = allSubmissions.filter(s => s.status === 'new').length;
            const readCount = allSubmissions.filter(s => s.status === 'read').length;
            const repliedCount = allSubmissions.filter(s => s.status === 'replied').length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('newCount').textContent = newCount;
            document.getElementById('readCount').textContent = readCount;
            document.getElementById('repliedCount').textContent = repliedCount;
        }

        // Display submissions
        function displaySubmissions(submissions) {
            const container = document.getElementById('submissionsContainer');
            container.innerHTML = '';

            submissions.forEach(submission => {
                const card = createSubmissionCard(submission);
                container.appendChild(card);
            });
        }

        // Create submission card
        function createSubmissionCard(submission) {
            const card = document.createElement('div');
            card.className = 'submission-card';

            const date = submission.submittedAt ?
                submission.submittedAt.toDate().toLocaleString() :
                'Unknown date';

            card.innerHTML = `
                <div class="submission-header">
                    <div class="submission-info">
                        <div class="submission-name">${submission.name}</div>
                        <div class="submission-meta">
                            <span>📧 ${submission.email}</span>
                            ${submission.phone && submission.phone !== 'Not provided' ? `<span>📞 ${submission.phone}</span>` : ''}
                            <span>🕒 ${date}</span>
                        </div>
                    </div>
                    <span class="badge badge-${submission.status}">${submission.status}</span>
                </div>
                <div class="submission-subject">${submission.subject}</div>
                <div class="submission-message">${submission.message}</div>
                <div class="submission-actions">
                    <button class="action-btn" onclick="updateStatus('${submission.id}', 'new')">Mark New</button>
                    <button class="action-btn" onclick="updateStatus('${submission.id}', 'read')">Mark Read</button>
                    <button class="action-btn" onclick="updateStatus('${submission.id}', 'replied')">Mark Replied</button>
                    <button class="action-btn" onclick="viewDetails('${submission.id}')">View Details</button>
                    <button class="action-btn delete" onclick="deleteSubmission('${submission.id}')">🗑️ Delete</button>
                </div>
            `;

            return card;
        }

        // Update status
        window.updateStatus = async function (id, newStatus) {
            try {
                await updateDoc(doc(db, 'contact_submissions', id), {
                    status: newStatus
                });

                console.log(`✅ Updated status to ${newStatus}`);
                loadSubmissions();
            } catch (error) {
                console.error('❌ Error updating status:', error);
                alert('Failed to update status: ' + error.message);
            }
        };

        // Delete submission
        window.deleteSubmission = async function (id) {
            if (!confirm('Are you sure you want to delete this submission?')) {
                return;
            }

            try {
                await deleteDoc(doc(db, 'contact_submissions', id));
                console.log('✅ Submission deleted');
                loadSubmissions();
            } catch (error) {
                console.error('❌ Error deleting submission:', error);
                alert('Failed to delete submission: ' + error.message);
            }
        };

        // View details
        window.viewDetails = function (id) {
            const submission = allSubmissions.find(s => s.id === id);
            if (!submission) return;

            const date = submission.submittedAt ?
                submission.submittedAt.toDate().toLocaleString() :
                'Unknown date';

            document.getElementById('modalTitle').textContent = `Submission from ${submission.name}`;
            document.getElementById('modalBody').innerHTML = `
                <p><strong>Name:</strong> ${submission.name}</p>
                <p><strong>Email:</strong> ${submission.email}</p>
                <p><strong>Phone:</strong> ${submission.phone || 'Not provided'}</p>
                <p><strong>Subject:</strong> ${submission.subject}</p>
                <p><strong>Date:</strong> ${date}</p>
                <p><strong>Status:</strong> <span class="badge badge-${submission.status}">${submission.status}</span></p>
                <p><strong>Message:</strong></p>
                <p style="background: #f7fafc; padding: 15px; border-radius: 6px; margin-top: 10px;">${submission.message}</p>
                ${submission.userAgent ? `<p style="font-size: 12px; color: #718096; margin-top: 15px;"><strong>User Agent:</strong> ${submission.userAgent}</p>` : ''}
            `;

            document.getElementById('detailsModal').classList.add('active');
        };

        // Close modal
        window.closeModal = function () {
            document.getElementById('detailsModal').classList.remove('active');
        };

        // Filter submissions
        window.filterSubmissions = function () {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchText = document.getElementById('searchBox').value.toLowerCase();

            let filtered = allSubmissions;

            // Filter by status
            if (statusFilter !== 'all') {
                filtered = filtered.filter(s => s.status === statusFilter);
            }

            // Filter by search text
            if (searchText) {
                filtered = filtered.filter(s =>
                    s.name.toLowerCase().includes(searchText) ||
                    s.email.toLowerCase().includes(searchText) ||
                    s.subject.toLowerCase().includes(searchText) ||
                    s.message.toLowerCase().includes(searchText)
                );
            }

            displaySubmissions(filtered);

            // Show empty state if no results
            const submissionsContainer = document.getElementById('submissionsContainer');
            const emptyState = document.getElementById('emptyState');

            if (filtered.length === 0) {
                submissionsContainer.style.display = 'none';
                emptyState.style.display = 'block';
                emptyState.innerHTML = `
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <h3>No results found</h3>
                    <p>Try adjusting your filters or search query</p>
                `;
            } else {
                submissionsContainer.style.display = 'block';
                emptyState.style.display = 'none';
            }
        };

        // Load submissions on page load
        window.addEventListener('load', loadSubmissions);
    </script>
</body>

</html>
